spring.application.name=comanda-digital-api
server.port=${PORT:8080}

# ---- Banco (MySQL). Tudo via variavel de ambiente (RNF12) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/comanda_digital?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ---- JPA: o schema e do Flyway, nunca do Hibernate (RNF07) ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- JWT (RNF02): segredo NUNCA no codigo. Minimo 32 caracteres ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=8

# ---- CORS (RNF03): separe varias origens por virgula ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---- Swagger (RNF11) ----
springdoc.swagger-ui.path=/swagger-ui.html
